name: 功能建议 / Feature request
description: 告诉我们你希望 D-one 如何变得更好
title: "[Idea] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到了什么问题？
      description: 先描述使用场景，而不只是按钮或功能名称。
      placeholder: 当我正在……时，我希望……
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的建议
    validations:
      required: true
  - type: dropdown
    id: importance
    attributes:
      label: 这个建议对你有多重要？
      options:
        - 没有它也能继续使用
        - 会明显改善体验
        - 它决定了我是否长期使用
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 参考截图或补充信息
