<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>D-one</title><link rel="stylesheet" href="assistant.css"><style>
:root{color-scheme:light;--paper:#f3f0e8;--ink:#3f3b34;--muted:#8a8479;--line:#ddd7ca}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
.app{height:100vh;padding:5px;display:flex;flex-direction:column;gap:4px}.dragbar{height:8px;flex:none;-webkit-app-region:drag}.list{display:grid;grid-auto-rows:34px;gap:4px;overflow:auto;min-height:0;flex:1}
.task{display:grid;grid-template-columns:17px minmax(0,1fr) 28px 17px 15px;align-items:center;gap:3px;height:34px;padding:4px 6px;border-radius:7px;border:1px solid transparent;cursor:grab;transition:.12s}.task:active{cursor:grabbing}.task.dragging{opacity:.35}.task.over{outline:2px dashed #9f8f5d}
.task.p0{background:#f5ece9;border-color:#e8d8d3}.task.p1{background:#f3efe3;border-color:#e3dcc8}.task.p2{background:#eaf1e8;border-color:#d3dfd0}
.dot{position:relative;width:12px;height:12px;border-radius:50%;border:.5px solid #0002;box-shadow:inset 0 1px 1px #fff8,0 .5px 1px #0002;cursor:pointer;padding:0}.p0 .dot{background:#ff5f57}.p1 .dot{background:#febc2e}.p2 .dot{background:#28c840}
.dot:after{content:'';position:absolute;inset:2px;border-radius:50%;background:linear-gradient(#fff3,transparent)}
.idol-theme{--paper:#f5f2e9;--line:#d9d4c8}.idol-theme.top-p0{--paper:#f7e2e4}.idol-theme.top-p1{--paper:#f8f0cb}.idol-theme.top-p2{--paper:#def2ef}.idol-theme .task.p0{background:#f7e2e4;border-color:#e9c3c8}.idol-theme .task.p1{background:#f8f0cb;border-color:#e8d99b}.idol-theme .task.p2{background:#def2ef;border-color:#b9ded8}
.idol-theme .dot{width:16px;height:16px;border:1px solid #fff9;box-shadow:0 1px 2px #4f493630,inset 0 0 0 .5px #0001;background-position:center;background-repeat:no-repeat;background-size:145%}.idol-theme .p0 .dot{background-color:#e76872;background-image:url('assets/teto-avatar-v1.png')}.idol-theme .p1 .dot{background-color:#efcf57;background-image:url('assets/neru-avatar-v1.png')}.idol-theme .p2 .dot{background-color:#72cfc3;background-image:url('assets/miku-avatar-v2.png')}.idol-theme .dot:after{display:none}
.text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:25px;cursor:text;outline:none;border-radius:4px;padding:0 2px}.text:focus{background:#fff9;box-shadow:0 0 0 1px #c6aa54;white-space:nowrap}.details,.item-eye,.delete{border:0;background:transparent;color:#8e7f59;line-height:1;cursor:pointer;padding:0;opacity:.55}.details{height:22px;min-width:27px;border-radius:5px;font:600 10px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.details:hover{opacity:1;background:#fff8;color:#554b32}.details.has-notes{opacity:.9;color:#66552e}.item-eye{font-size:13px}.item-eye:hover{opacity:1;color:#554b32}.delete{font-size:16px}.delete:hover{opacity:1;color:#c23e33}
.footer{position:relative;display:flex;align-items:center;justify-content:center;gap:6px;height:24px;flex:none}.footer button{border:1px solid var(--line);background:#f8f6f0;color:var(--muted);border-radius:6px;height:22px;min-width:27px;cursor:pointer}.footer button:hover,.footer button.active{color:var(--ink);background:#fff}#hidden{position:absolute;right:0;bottom:1px}
.miku-button{position:absolute;left:0;bottom:0;width:24px;min-width:24px!important;height:24px!important;padding:0!important;border-radius:50%!important;overflow:hidden;background:#eaf7f4!important;border-color:#cbded9!important;box-shadow:0 1px 3px #4f7f7826}.miku-button img{display:block;width:100%;height:100%;object-fit:cover;transform:scale(1.08)}.miku-button:hover{box-shadow:0 1px 5px #4f7f7840;transform:translateY(-1px)}.miku-button:active{transform:scale(.92)}.idol-theme .miku-button{border-color:#6fbfb5!important;box-shadow:0 0 0 2px #a8ddd6,0 1px 4px #4f7f7840}.miku-button.bounce{animation:mikuBounce .38s ease}@keyframes mikuBounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-3px) scale(1.04)}}
.idol-theme #add,.idol-theme #collapse{position:relative;width:34px;min-width:34px;height:24px;padding:0;border:0;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:30px 30px;color:transparent!important;box-shadow:none;overflow:visible}.idol-theme #add:hover,.idol-theme #collapse:hover{background-color:transparent;transform:translateY(-1px)}.idol-theme #add:active,.idol-theme #collapse:active{transform:scale(.94)}
.idol-theme.top-p0 #add,.idol-theme.top-p0 #collapse{background-image:url('assets/teto-sign-v1.png')}.idol-theme.top-p1 #add,.idol-theme.top-p1 #collapse{background-image:url('assets/neru-sign-v1.png')}.idol-theme.top-p2 #add,.idol-theme.top-p2 #collapse{background-image:url('assets/miku-sign-v1.png')}
.idol-theme #add:after,.idol-theme #collapse:after{position:absolute;left:50%;top:19px;transform:translate(-50%,-50%);color:#4b4036;font:700 10px/1 -apple-system,BlinkMacSystemFont,sans-serif;text-shadow:0 1px #fff8}.idol-theme #add:after{content:'＋'}.idol-theme #collapse:after{content:'−'}
.compact .list,.compact .footer,.compact .dragbar{display:none!important}.compact{padding:0}.compact-line{display:none;position:fixed;inset:0;align-items:center;gap:7px;padding:0 10px;-webkit-app-region:drag;cursor:pointer}.compact .compact-line{display:flex}.compact-line .dot{flex:none}.compact-text{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--ink)}.expand{font-size:10px;color:var(--muted);-webkit-app-region:no-drag}
.mascot-stage{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:5px;-webkit-app-region:drag}.mascot-character{display:block;width:100%;height:100%;padding:0;border:0;background-color:transparent;background-position:center;background-repeat:no-repeat;background-size:contain;filter:drop-shadow(0 5px 7px #2d26352e);cursor:pointer;-webkit-app-region:no-drag;transition:width .16s ease,height .16s ease,transform .12s ease}.mascot-character:hover{transform:translateY(-2px) scale(1.015)}.mascot-character:active{transform:scale(.97)}
html.mascot-mode,html.mascot-mode body{background:transparent!important}.mascot-mode .app{display:none}.mascot-mode .mascot-stage{display:flex}.mascot-size-medium .mascot-character{width:82%;height:82%}.mascot-size-small .mascot-character{width:64%;height:64%}
.mascot-menu{display:none;position:fixed;right:7px;bottom:7px;z-index:5;gap:3px;padding:4px;border:1px solid #d8d2c5;border-radius:8px;background:#f7f3e9e8;box-shadow:0 5px 18px #372f2530;-webkit-app-region:no-drag}.mascot-menu.open{display:flex}.mascot-menu button{min-width:30px;height:24px;padding:0 7px;border:0;border-radius:5px;background:transparent;color:#5d564b;cursor:pointer}.mascot-menu button:hover,.mascot-menu button.active{background:#fff;color:#2e2a25}
dialog{border:1px solid var(--line);border-radius:12px;background:#fff8d9;color:var(--ink);width:280px;padding:14px;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#0004}textarea{width:100%;height:85px;resize:none;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px;font:inherit;outline:none}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.actions button{border:0;border-radius:6px;padding:6px 10px;cursor:pointer}.save{background:#d6a027;color:white}
</style></head><body><main class="app">
  <div class="dragbar"></div>
  <section class="list" id="list"></section>
  <div class="footer"><button id="miku" class="miku-button" title="切换歌姬主题" aria-label="切换歌姬主题"><img src="assets/miku-avatar-v2.png" alt=""></button><button id="add" title="添加任务">＋</button><button id="visibility" title="显示或隐藏文字便签">◉</button><button id="collapse" title="只显示最高优先级">—</button><button id="hidden" title="管理隐藏便签" style="display:none">☰</button></div>
  <div class="compact-line" id="compact"><i class="dot" id="compactDot"></i><span class="compact-text" id="compactText"></span><span class="expand">展开</span></div>
</main>
<div class="mascot-stage" id="mascotStage"><button class="mascot-character" id="mascotImage" aria-label="最高优先级角色，点击返回便签；右键调整大小" title="点击返回便签，右键调整大小"></button></div>
<div class="mascot-menu" id="mascotMenu" aria-label="角色大小"><button data-size="small">小</button><button data-size="medium">中</button><button data-size="large">大</button></div>
<script>
const KEY='priority-desk-tasks-v1',VISIBLE_KEY='priority-desk-show-items',THEME_KEY='priority-desk-theme-v1',SIZE_KEY='priority-desk-mascot-size-v1',MASCOTS={0:'assets/mascot-teto.png',1:'assets/mascot-neru.png',2:'assets/mascot-miku.png'};const readTasks=()=>{try{let value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}},normalizeTasks=items=>items.filter(t=>t&&typeof t==='object').map(t=>({...t,done:false,visible:t.visible!==false,subnotes:Array.isArray(t.subnotes)?t.subnotes:[]}));let tasks=normalizeTasks(readTasks()),dragging=null,editBefore='',manageHidden=false,showItems=localStorage.getItem(VISIBLE_KEY)!=='false',idolTheme=localStorage.getItem(THEME_KEY)==='idol',mascotMode=false,mascotSize=['small','medium','large'].includes(localStorage.getItem(SIZE_KEY))?localStorage.getItem(SIZE_KEY):'large';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function applyTheme(){document.body.classList.toggle('idol-theme',idolTheme);$('#miku').classList.toggle('active',idolTheme);let label=idolTheme?'切回经典主题':'切换歌姬主题';$('#miku').title=label;$('#miku').setAttribute('aria-label',label)}
function persist(redraw=true){let latest=[];try{let value=JSON.parse(localStorage.getItem(KEY)||'[]');latest=Array.isArray(value)?value:[]}catch{}let byId=new Map(latest.map(t=>[String(t.id),t]));tasks=tasks.map(t=>{let saved=byId.get(String(t.id));return {...t,subnotes:Array.isArray(saved?.subnotes)?saved.subnotes:(Array.isArray(t.subnotes)?t.subnotes:[])}});localStorage.setItem(KEY,JSON.stringify(tasks));if(redraw)render()}
function resizeWindow(compact=false,mascot=false){let rows=manageHidden?tasks.filter(t=>!t.visible).length:(showItems?tasks.filter(t=>t.visible).length:0);window.webkit?.messageHandlers?.windowMode?.postMessage({compact,mascot,rows})}
function render(){
  let visibleTasks=tasks.filter(t=>t.visible),hiddenTasks=tasks.filter(t=>!t.visible),hiddenCount=hiddenTasks.length,viewTasks=manageHidden?hiddenTasks:visibleTasks;
  if(mascotMode&&!visibleTasks.length)mascotMode=false;
  $('#list').innerHTML=viewTasks.map(t=>{let count=t.subnotes.length;return `<article class="task p${t.priority}" draggable="true" data-id="${t.id}"><button class="dot" title="点击改变分类"></button><span class="text" contenteditable="true" spellcheck="false" title="直接点击编辑">${esc(t.text)}</span><button class="details${count?' has-notes':''}" title="打开子便签窗口" aria-label="打开 ${esc(t.text)} 的子便签">${count||'＋'}›</button><button class="item-eye" title="${manageHidden?'恢复显示':'隐藏这条便签'}">${manageHidden?'○':'◉'}</button><button class="delete" title="删除">×</button></article>`}).join('');
  let top=visibleTasks[0];
  document.body.classList.remove('top-p0','top-p1','top-p2');if(top)document.body.classList.add(`top-p${top.priority}`);
  document.documentElement.classList.toggle('mascot-mode',mascotMode);document.body.classList.toggle('mascot-mode',mascotMode);document.body.classList.remove('mascot-size-small','mascot-size-medium','mascot-size-large');document.body.classList.add(`mascot-size-${mascotSize}`);if(top)$('#mascotImage').style.backgroundImage=`url('${MASCOTS[top.priority]}')`;document.querySelectorAll('#mascotMenu button').forEach(b=>b.classList.toggle('active',b.dataset.size===mascotSize));window.renderAssistant?.(top,visibleTasks);
  $('#hidden').style.display=(hiddenCount||manageHidden)?'inline-block':'none';$('#hidden').classList.toggle('active',manageHidden);$('#list').style.display=(manageHidden||showItems)?'grid':'none';$('#visibility').textContent=showItems?'◉':'○';$('#visibility').title=idolTheme?'显示最高优先级角色':(showItems?'隐藏文字便签':'显示文字便签');$('#compactText').textContent=top?top.text:'＋ 添加事项';$('#compactDot').parentElement.className=`compact-line p${top?.priority??1}`;if(mascotMode)resizeWindow(false,true);else if(!document.body.classList.contains('compact'))resizeWindow(false,false);
}
$('#add').onclick=()=>{let id=crypto.randomUUID();tasks.push({id,text:'新事项',priority:1,visible:true,done:false,subnotes:[],created:Date.now()});persist();requestAnimationFrame(()=>{let el=document.querySelector(`[data-id="${id}"] .text`);el.focus();document.execCommand('selectAll',false,null)})};
$('#list').onclick=e=>{let row=e.target.closest('.task');if(!row)return;let i=tasks.findIndex(t=>t.id===row.dataset.id);if(e.target.classList.contains('dot')){tasks[i].priority=(tasks[i].priority+1)%3;window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'theme',taskId:tasks[i].id,priority:tasks[i].priority});persist();return}if(e.target.classList.contains('details')){window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'open',taskId:tasks[i].id,title:tasks[i].text,priority:tasks[i].priority});return}if(e.target.classList.contains('item-eye')){tasks[i].visible=manageHidden;persist();return}if(e.target.classList.contains('delete')){window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'close',taskId:tasks[i].id});tasks.splice(i,1);persist();return}};
$('#list').onfocusin=e=>{if(e.target.classList.contains('text'))editBefore=e.target.textContent};
$('#list').onfocusout=e=>{if(!e.target.classList.contains('text'))return;let row=e.target.closest('.task'),t=tasks.find(t=>t.id===row?.dataset.id);if(!t)return;let text=e.target.textContent.trim();if(text){t.text=text;window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'rename',taskId:t.id,title:t.text})}else e.target.textContent=t.text;persist(false);setTimeout(render,0)};
$('#list').onkeydown=e=>{if(!e.target.classList.contains('text'))return;if(e.key==='Enter'){e.preventDefault();e.target.blur()}if(e.key==='Escape'){e.preventDefault();e.target.textContent=editBefore;e.target.blur()}};
$('#list').ondragstart=e=>{let row=e.target.closest('.task');if(!row)return;dragging=row.dataset.id;row.classList.add('dragging');e.dataTransfer.effectAllowed='move'};
$('#list').ondragend=e=>{dragging=null;document.querySelectorAll('.task').forEach(x=>x.classList.remove('dragging','over'))};
$('#list').ondragover=e=>{e.preventDefault();let row=e.target.closest('.task');document.querySelectorAll('.task').forEach(x=>x.classList.remove('over'));if(row&&row.dataset.id!==dragging)row.classList.add('over')};
$('#list').ondrop=e=>{e.preventDefault();let target=e.target.closest('.task');if(!target||target.dataset.id===dragging)return;let from=tasks.findIndex(t=>t.id===dragging),to=tasks.findIndex(t=>t.id===target.dataset.id),item=tasks.splice(from,1)[0];tasks.splice(to,0,item);persist()};
function compact(on){document.body.classList.toggle('compact',on);resizeWindow(on);render()}
$('#visibility').onclick=()=>{manageHidden=false;if(idolTheme){if(!tasks.some(t=>t.visible))return;mascotMode=true;render();return}showItems=!showItems;localStorage.setItem(VISIBLE_KEY,showItems);render()};$('#hidden').onclick=()=>{manageHidden=!manageHidden;render()};$('#collapse').onclick=()=>compact(true);$('#compact').onclick=()=>compact(false);$('#mascotImage').onclick=e=>{if(e.button!==0)return;mascotMode=false;$('#mascotMenu').classList.remove('open');render()};$('#mascotImage').oncontextmenu=e=>{e.preventDefault();e.stopPropagation();$('#mascotMenu').classList.add('open')};$('#mascotMenu').onclick=e=>{let button=e.target.closest('[data-size]');if(!button)return;e.stopPropagation();mascotSize=button.dataset.size;localStorage.setItem(SIZE_KEY,mascotSize);$('#mascotMenu').classList.remove('open');render()};document.addEventListener('click',e=>{if(!e.target.closest('#mascotMenu'))$('#mascotMenu').classList.remove('open')});applyTheme();render();
$('#miku').onclick=e=>{mascotMode=false;idolTheme=!idolTheme;localStorage.setItem(THEME_KEY,idolTheme?'idol':'classic');applyTheme();render();e.currentTarget.classList.remove('bounce');requestAnimationFrame(()=>e.currentTarget.classList.add('bounce'))};$('#miku').onanimationend=e=>e.currentTarget.classList.remove('bounce');
window.refreshTasksFromStorage=()=>{tasks=normalizeTasks(readTasks());render()};
</script><script src="assistant.js"></script></body></html>
