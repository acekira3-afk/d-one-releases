<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>子便签</title><style>
:root{color-scheme:light;--paper:#f8f0cb;--ink:#423d35;--muted:#887d68;--line:#e2d59e;--note:#fff9dc;--accent:#efcf57;--focus:#d2ae32;--avatar:url('assets/neru-avatar-v1.png')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:var(--paper);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;transition:background-color .18s ease}.theme-p0{--paper:#f7e2e4;--muted:#8d7073;--line:#e9c3c8;--note:#fff2f3;--accent:#e76872;--focus:#cc5661;--avatar:url('assets/teto-avatar-v1.png')}.theme-p1{--paper:#f8f0cb;--muted:#887d68;--line:#e2d59e;--note:#fff9dc;--accent:#efcf57;--focus:#d2ae32;--avatar:url('assets/neru-avatar-v1.png')}.theme-p2{--paper:#def2ef;--muted:#66837f;--line:#b9ded8;--note:#effaf8;--accent:#72cfc3;--focus:#46aa9d;--avatar:url('assets/miku-avatar-v2.png')}.app{height:100vh;padding:6px;display:flex;flex-direction:column;gap:5px}.dragbar{height:7px;flex:none;-webkit-app-region:drag}.header{display:flex;align-items:center;gap:7px;min-height:30px;padding:0 3px}.avatar{width:22px;height:22px;flex:none;border-radius:50%;background-color:var(--accent);background-image:var(--avatar);background-position:center;background-repeat:no-repeat;background-size:145%;border:1px solid #fff9;box-shadow:0 1px 3px #3e34251f}.heading{display:flex;min-width:0;flex:1;align-items:baseline;gap:6px}.title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-weight:650}.character{flex:none;color:var(--muted);font-size:10px}.count{color:var(--muted);font-size:10px}.notes{display:grid;grid-auto-rows:minmax(38px,auto);align-content:start;gap:5px;min-height:0;overflow:auto;flex:1}.note{display:grid;grid-template-columns:7px minmax(0,1fr) 18px;align-items:start;gap:6px;padding:7px 7px 6px;border:1px solid var(--line);border-radius:8px;background:var(--note);box-shadow:0 1px 2px #58472b0d}.mark{width:6px;height:6px;margin-top:7px;border-radius:50%;background:var(--accent)}.note-text{min-height:22px;max-height:92px;overflow:auto;white-space:pre-wrap;word-break:break-word;outline:none;line-height:18px;border-radius:4px}.note-text:focus{background:#fff;box-shadow:0 0 0 1px var(--focus);padding:0 3px}.delete{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:18px;padding:0}.delete:hover{color:#c5574f}.empty{display:none;position:absolute;left:12px;right:12px;top:70px;text-align:center;color:var(--muted);font-size:12px;pointer-events:none;opacity:.72}.empty.show{display:block}.footer{height:27px;display:flex;justify-content:center;align-items:center;flex:none}.add{height:24px;min-width:72px;padding:0 13px;border:1px solid var(--line);border-radius:7px;background:var(--note);color:var(--ink);cursor:pointer}.add:hover{background:white;color:#433a2d}
</style></head><body class="theme-p1"><main class="app"><div class="dragbar"></div><header class="header"><i class="avatar" aria-hidden="true"></i><div class="heading"><strong class="title" id="title"></strong><span class="character" id="character"></span></div><span class="count" id="count"></span></header><section class="notes" id="notes"></section><div class="empty" id="empty">添加细节，让主便签保持简洁</div><footer class="footer"><button class="add" id="add">＋ 子便签</button></footer></main><script>
const KEY='priority-desk-tasks-v1',params=new URLSearchParams(location.search),taskId=params.get('task');let before='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function allTasks(){try{let value=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(value)?value:[]}catch{return []}}
function current(){return allTasks().find(t=>String(t.id)===String(taskId))}
function saveTask(change){let tasks=allTasks(),i=tasks.findIndex(t=>String(t.id)===String(taskId));if(i<0)return false;tasks[i]={...tasks[i],...change};localStorage.setItem(KEY,JSON.stringify(tasks));window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'changed',taskId});return true}
const characterNames=['Teto','亚北','Miku'];function applyTheme(priority){let p=[0,1,2].includes(Number(priority))?Number(priority):1;document.body.classList.remove('theme-p0','theme-p1','theme-p2');document.body.classList.add(`theme-p${p}`);$('#character').textContent=characterNames[p]}
function render(){let task=current();if(!task){$('#title').textContent='便签已删除';$('#character').textContent='';$('#notes').innerHTML='';$('#empty').classList.add('show');$('#add').disabled=true;return}applyTheme(task.priority);let notes=Array.isArray(task.subnotes)?task.subnotes:[];$('#title').textContent=task.text||'未命名便签';$('#count').textContent=notes.length?`${notes.length} 条细节`:'';$('#notes').innerHTML=notes.map(n=>`<article class="note" data-id="${esc(n.id)}"><i class="mark"></i><div class="note-text" contenteditable="true" spellcheck="false">${esc(n.text)}</div><button class="delete" title="删除子便签">×</button></article>`).join('');$('#empty').classList.toggle('show',!notes.length);window.webkit?.messageHandlers?.detailWindow?.postMessage({action:'resize',taskId,rows:notes.length})}
$('#add').onclick=()=>{let task=current();if(!task)return;let notes=Array.isArray(task.subnotes)?task.subnotes.slice():[];let id=crypto.randomUUID();notes.push({id,text:'新的细节',created:Date.now()});saveTask({subnotes:notes});render();requestAnimationFrame(()=>{let el=document.querySelector(`[data-id="${id}"] .note-text`);el?.focus();document.execCommand('selectAll',false,null)})};
$('#notes').onclick=e=>{if(!e.target.classList.contains('delete'))return;let task=current(),row=e.target.closest('.note');if(!task||!row)return;let notes=(Array.isArray(task.subnotes)?task.subnotes:[]).filter(n=>String(n.id)!==row.dataset.id);saveTask({subnotes:notes});render()};
$('#notes').onfocusin=e=>{if(e.target.classList.contains('note-text'))before=e.target.textContent};
$('#notes').onfocusout=e=>{if(!e.target.classList.contains('note-text'))return;let task=current(),row=e.target.closest('.note');if(!task||!row)return;let value=e.target.textContent.trim();if(!value)e.target.textContent=before;let notes=(Array.isArray(task.subnotes)?task.subnotes:[]).map(n=>String(n.id)===row.dataset.id?{...n,text:value||before}:n);saveTask({subnotes:notes})};
$('#notes').onkeydown=e=>{if(!e.target.classList.contains('note-text'))return;if(e.key==='Escape'){e.preventDefault();e.target.textContent=before;e.target.blur()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();e.target.blur()}};
window.updateParentTitle=title=>{$('#title').textContent=title||'未命名便签'};window.updateParentTheme=priority=>applyTheme(priority);window.addEventListener('storage',e=>{if(e.key!==KEY)return;let task=current();if(document.activeElement?.classList.contains('note-text')){if(task){$('#title').textContent=task.text||'未命名便签';applyTheme(task.priority)}return}render()});render();
</script></body></html>
